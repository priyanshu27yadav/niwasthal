services:
  - type: web
    name: niwasthal
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Niwasthal
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: prefer
      - key: DB_URL
        fromDatabase:
          name: niwasthal-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: RENDER_SECRET_KEY
        generateValue: true

databases:
  - name: niwasthal-db
    plan: free
    databaseName: niwasthal
    user: niwasthal
